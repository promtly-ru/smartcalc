<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Фоновый слой адаптивной иконки Android -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d39a"/>
      <stop offset="0.55" stop-color="#0ea271"/>
      <stop offset="1" stop-color="#05603f"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.05" r="0.85">
