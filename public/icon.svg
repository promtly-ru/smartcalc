<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d39a"/>
      <stop offset="0.55" stop-color="#0ea271"/>
      <stop offset="1" stop-color="#05603f"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#012116" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- тонкие разделители -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="110" x2="256" y2="402"/>
    <line x1="110" y1="256" x2="402" y2="256"/>
  </g>

  <g filter="url(#shadow)">
    <!-- = на белой «клавише» -->
    <rect x="282" y="282" width="112" height="112" rx="32" fill="#ffffff"/>
    <g stroke-width="26" stroke-linecap="round" fill="none">
      <g stroke="#ffffff">
        <line x1="140" y1="176" x2="212" y2="176"/>
        <line x1="176" y1="140" x2="176" y2="212"/>
        <line x1="300" y1="176" x2="372" y2="176"/>
        <line x1="150" y1="310" x2="202" y2="362"/>
        <line x1="202" y1="310" x2="150" y2="362"/>
      </g>
      <g stroke="#047857" stroke-width="22">
        <line x1="312" y1="323" x2="364" y2="323"/>
        <line x1="312" y1="353" x2="364" y2="353"/>
      </g>
    </g>
  </g>
</svg>
